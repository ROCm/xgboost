[pytest]
markers =
    mgpu: Mark a test that requires multiple GPUs to run.
    ci: Mark a test that runs only on CI.
addopts =
        --deselect python-gpu/test_gpu_ordinal.py::test_cat_shap
        --deselect python-gpu/test_device_quantile_dmatrix.py::TestQuantileDMatrix::test_initialization[True-cpu]
        --deselect python-gpu/test_device_quantile_dmatrix.py::TestQuantileDMatrix::test_initialization[True-cuda]
        --deselect python-gpu/test_from_cupy.py::TestFromCupy::test_specified_device
        --deselect python-gpu/test_gpu_basic_models.py::TestGPUBasicModels::test_custom_objective
        --deselect python-gpu/test_gpu_interaction_constraints.py::TestGPUInteractionConstraints::test_training_accuracy[hist]
        --deselect python-gpu/test_gpu_interaction_constraints.py::TestGPUInteractionConstraints::test_training_accuracy[approx]
        --deselect python-gpu/test_gpu_pickling.py::TestPickling::test_pickled_context
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:pairwise-auc]
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:pairwise-ndcg]
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:pairwise-map]
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:ndcg-auc]
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:ndcg-ndcg]
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:ndcg-map]
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:map-auc]
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:map-ndcg]
        --deselect python-gpu/test_gpu_ranking.py::test_with_mq2008[rank:map-map]
        --deselect python-gpu/test_gpu_updaters.py::TestGPUUpdaters::test_init_estimation
        --deselect python-gpu/test_gpu_with_sklearn.py::test_categorical
        --deselect python-gpu/test_gpu_with_sklearn.py::test_device_ordinal
        --ignore tests/python-gpu/test_gpu_prediction.py
        --ignore tests/python-gpu/test_gpu_demos.py
        --ignore tests/python-gpu/test_gpu_callbacks.py
